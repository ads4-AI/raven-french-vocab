<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d2433">
<title>Spanish vocab practice</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2430;--mut:#6b7280;--acc:#4f6bed;--ok:#1f9d6b;--bad:#d9534f;--warn:#d98a1f;--line:#e4e1d9;--chip:#ecebe6}
.dark{--bg:#141821;--card:#1f2533;--ink:#eef0f5;--mut:#9aa3b5;--acc:#8ea2ff;--ok:#3fcf94;--bad:#ff7b76;--warn:#f0b35a;--line:#2e3647;--chip:#2a3142}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:18px;line-height:1.4}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:1.15rem;margin:6px 0}
.icon{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;min-width:44px;height:44px;font-size:1.1rem;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tabs button,.chips button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem;font-weight:600;cursor:pointer;padding:6px 10px}
.chips button{flex:0 0 auto;min-height:40px;font-size:.92rem;font-weight:500;background:var(--chip)}
.tabs button.on,.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar>div{height:100%;background:var(--ok);width:0;transition:width .3s}
.stats{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;min-height:260px;margin:14px 0;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.06);cursor:pointer;user-select:none;position:relative}
.card .lab{position:absolute;top:12px;left:16px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.card .sec{position:absolute;top:12px;right:16px;font-size:.78rem;color:var(--mut)}
.card .star{position:absolute;bottom:10px;right:14px;color:var(--warn);font-size:1.1rem}
.big{font-size:1.75rem;font-weight:650;line-height:1.25;word-break:break-word}
.sub{color:var(--mut);margin-top:12px;font-size:1rem}
.hint{color:var(--mut);font-size:.85rem;text-align:center}
.btns{display:flex;gap:10px}
.btns button,.main{flex:1;min-height:58px;border:none;border-radius:16px;font-size:1.08rem;font-weight:700;cursor:pointer;color:#fff}
.b-bad{background:var(--warn)}.b-ok{background:var(--ok)}.main{background:var(--acc);width:100%}
.b-sec{background:var(--chip)!important;color:var(--ink)!important;border:1px solid var(--line)!important}
input[type=text]{width:100%;font-size:1.35rem;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);outline:none}
input[type=text]:focus{border-color:var(--acc)}
.acc{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.acc button{min-width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-size:1.1rem;cursor:pointer}
.fb{margin:10px 0;padding:12px 14px;border-radius:14px;font-size:1.05rem;display:none}
.fb.ok{display:block;background:rgba(31,157,107,.14);color:var(--ok)}
.fb.bad{display:block;background:rgba(217,83,79,.13);color:var(--bad)}
.fb.near{display:block;background:rgba(217,138,31,.14);color:var(--warn)}
.fb b{color:var(--ink)}
.opts{display:grid;gap:10px}
.opts button{min-height:58px;text-align:left;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:1.05rem;cursor:pointer}
.opts button.right{border-color:var(--ok);background:rgba(31,157,107,.14)}
.opts button.wrong{border-color:var(--bad);background:rgba(217,83,79,.13)}
.done{text-align:center;padding:24px 10px}
.done .tick{font-size:4rem;color:var(--ok)}
.small{font-size:.85rem;color:var(--mut)}
.link{background:none;border:none;color:var(--acc);text-decoration:underline;cursor:pointer;font-size:.9rem;padding:6px}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.7}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.95rem;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Spanish vocab practice</h1>
    <div style="display:flex;gap:6px">
      <button class="icon" id="dirBtn" title="Swap direction">EN→ES</button>
      <button class="icon" id="themeBtn" title="Dark / light">◐</button>
    </div>
  </header>

  <div class="row tabs" id="modes">
    <button data-m="cards" class="on">Flashcards</button>
    <button data-m="type">Type it</button>
    <button data-m="quiz">Quiz</button>
  </div>
  <div class="row chips" id="decks"></div>

  <div class="bar"><div id="prog"></div></div>
  <div class="stats"><span id="sScore">Score 0</span><span id="sStreak">Streak 0</span><span id="sLeft">0 left</span></div>

  <div id="stage"></div>
  <div style="text-align:center;margin-top:6px">
    <button class="link" id="restart">↻ Shuffle &amp; restart</button>
    <button class="link" id="clearHard">Clear ★ Hard ones</button>
  </div>
  <p class="small" style="text-align:center">Claro 2 · Units 2.3, 2.4, 2.5 · <span id="total"></span> words. Progress saves on this device.</p>
</div>
<div id="confetti"></div>
<div class="toast" id="toast"></div>

<script>
const WORDS = [{"id": "2.3-1", "s": "2.3", "en": "it’s amazing", "fr": "¡es flipante!"}, {"id": "2.3-2", "s": "2.3", "en": "it’s incredible", "fr": "¡es la pera!"}, {"id": "2.3-3", "s": "2.3", "en": "it’s very cool", "fr": "¡es muy guay!"}, {"id": "2.3-4", "s": "2.3", "en": "it’s a pain", "fr": "¡es un rollo!"}, {"id": "2.3-5", "s": "2.3", "en": "it’s out of this world", "fr": "¡mola mucho!"}, {"id": "2.3-6", "s": "2.3", "en": "what a bore", "fr": "¡qué aburrimiento!"}, {"id": "2.3-7", "s": "2.3", "en": "how awesome", "fr": "¡qué chulo!"}, {"id": "2.3-8", "s": "2.3", "en": "how annoying", "fr": "¡qué fastidio!"}, {"id": "2.3-9", "s": "2.3", "en": "have a picnic", "fr": "hacer un picnic"}, {"id": "2.3-10", "s": "2.3", "en": "go hiking", "fr": "hacer senderismo"}, {"id": "2.3-11", "s": "2.3", "en": "go up in a hot-air balloon", "fr": "montar en globo"}, {"id": "2.3-12", "s": "2.3", "en": "ride a jet-ski", "fr": "montar en moto acuática"}, {"id": "2.3-13", "s": "2.3", "en": "collect shells in rock pools", "fr": "recoger conchas en los charcos"}, {"id": "2.3-14", "s": "2.3", "en": "visit the archaeological museum", "fr": "visitar el museo arqueológico"}, {"id": "2.3-15", "s": "2.3", "en": "approximate", "fr": "aproximado/a"}, {"id": "2.3-16", "s": "2.3", "en": "risky", "fr": "arriesgado/a"}, {"id": "2.3-17", "s": "2.3", "en": "educational", "fr": "educativo/a"}, {"id": "2.3-18", "s": "2.3", "en": "stimulating", "fr": "estimulante"}, {"id": "2.3-19", "s": "2.3", "en": "dangerous", "fr": "peligroso/a"}, {"id": "2.3-20", "s": "2.3", "en": "relaxing", "fr": "relajante"}, {"id": "2.3-21", "s": "2.3", "en": "adventure", "fr": "la aventura"}, {"id": "2.4-1", "s": "2.4", "en": "last year", "fr": "el año pasado"}, {"id": "2.4-2", "s": "2.4", "en": "last month", "fr": "el mes pasado"}, {"id": "2.4-3", "s": "2.4", "en": "on my last holiday", "fr": "en mis últimas vacaciones"}, {"id": "2.4-4", "s": "2.4", "en": "last summer", "fr": "el verano pasado"}, {"id": "2.4-5", "s": "2.4", "en": "in the open air", "fr": "al aire libre"}, {"id": "2.4-6", "s": "2.4", "en": "barbecue", "fr": "la barbacoa"}, {"id": "2.4-7", "s": "2.4", "en": "campsite", "fr": "el camping"}, {"id": "2.4-8", "s": "2.4", "en": "island", "fr": "la isla"}, {"id": "2.4-9", "s": "2.4", "en": "dance in a night club", "fr": "bailar en una discoteca"}, {"id": "2.4-10", "s": "2.4", "en": "buy souvenirs", "fr": "comprar recuerdos"}, {"id": "2.4-11", "s": "2.4", "en": "go cycling", "fr": "hacer ciclismo"}, {"id": "2.4-12", "s": "2.4", "en": "swim in the pool", "fr": "nadar en la piscina"}, {"id": "2.4-13", "s": "2.4", "en": "try the local cuisine", "fr": "probar la gastronomía local"}, {"id": "2.4-14", "s": "2.4", "en": "take selfies", "fr": "sacar selfis"}, {"id": "2.4-15", "s": "2.4", "en": "go out with friends", "fr": "salir con los amigos"}, {"id": "2.4-16", "s": "2.4", "en": "watch a match", "fr": "ver un partido"}, {"id": "2.5-1", "s": "2.5", "en": "take a guided tour", "fr": "hacer una visita guiada"}, {"id": "2.5-2", "s": "2.5", "en": "observe nature", "fr": "observar la naturaleza"}, {"id": "2.5-3", "s": "2.5", "en": "plan", "fr": "planear"}, {"id": "2.5-4", "s": "2.5", "en": "climb a mountain", "fr": "subir una montaña"}, {"id": "2.5-5", "s": "2.5", "en": "capybara", "fr": "la capibara"}, {"id": "2.5-6", "s": "2.5", "en": "deforestation", "fr": "la deforestación"}, {"id": "2.5-7", "s": "2.5", "en": "dolphin", "fr": "el delfín"}, {"id": "2.5-8", "s": "2.5", "en": "experience", "fr": "la experiencia"}, {"id": "2.5-9", "s": "2.5", "en": "hostel", "fr": "el hostal"}, {"id": "2.5-10", "s": "2.5", "en": "capuchin monkey", "fr": "el mono capuchino"}, {"id": "2.5-11", "s": "2.5", "en": "poisonous frog", "fr": "la rana venenosa"}, {"id": "2.5-12", "s": "2.5", "en": "the Amazon river", "fr": "el río Amazonas"}, {"id": "2.5-13", "s": "2.5", "en": "tropical rainforest", "fr": "la selva tropical"}, {"id": "2.5-14", "s": "2.5", "en": "tribe", "fr": "la tribu"}, {"id": "2.5-15", "s": "2.5", "en": "toucan", "fr": "el tucán"}, {"id": "2.5-16", "s": "2.5", "en": "valley", "fr": "el valle"}, {"id": "2.5-17", "s": "2.5", "en": "flight", "fr": "el vuelo"}];
const SECS = [["All","All"],["2.3","2.3 ¡Esto es la pera!"],["2.4","2.4 Te cuento qué pasó"],["2.5","2.5 Aventura amazónica"],["Hard","★ Hard ones"]];
const LS = k => "es-vocab-" + k;
const load = (k,d) => { try { const v = localStorage.getItem(LS(k)); return v===null ? d : JSON.parse(v); } catch(e){ return d; } };
const save = (k,v) => { try { localStorage.setItem(LS(k), JSON.stringify(v)); } catch(e){} };

let st = { mode: load("mode","cards"), deck: load("deck","All"), dir: load("dir","en"), dark: load("dark", window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) };
let hard = new Set(load("hard", []));
let queue = [], cur = null, flipped = false, answered = false, score = 0, streak = 0, best = 0, seen = 0, startCount = 0;

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("show"),1600); }

function deckWords(){
  if (st.deck==="All") return WORDS;
  if (st.deck==="Hard") return WORDS.filter(w=>hard.has(w.id));
  return WORDS.filter(w=>w.s===st.deck);
}
const prompt = w => st.dir==="en" ? w.en : w.fr;
const answer = w => st.dir==="en" ? w.fr : w.en;

/* ---- answer checking: case- and accent-insensitive, ignores punctuation, (m)/(f), extra spaces ---- */
function norm(s){
  return s.toLowerCase()
    .replace(/œ/g,"oe").replace(/æ/g,"ae")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\((m|f)\)/g," ")
    .replace(/[’‘`´]/g,"'")
    .replace(/'/g," ")
    .replace(/[?!¡¿.,;:…"«»()\-]/g," ")
    .replace(/\s+/g," ").trim();
}
function variants(ans){
  const v = new Set([norm(ans)]);
  ans.split(" / ").forEach(p => v.add(norm(p)));
  // "il faut + infinitive" -> accept "il faut"
  [...v].forEach(x => { const y = x.replace(/\+ ?infinitive/,"").trim(); if (y) v.add(y); });
  [...v].forEach(x => { const y = x.replace(/o\/a\b/g,"o"); v.add(y); v.add(x.replace(/o\/a\b/g,"a")); });
  v.delete("");
  return [...v];
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ let c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; }
  return p[n];
}
function check(input, ans){
  const g = norm(input).replace(/ /g,""); if (!g) return "bad";
  const vs = variants(ans).map(v=>v.replace(/ /g,""));
  if (vs.includes(g)) return "ok";
  const d = Math.min(...vs.map(v=>lev(g,v)));
  const tol = Math.max(1, Math.floor(Math.min(...vs.map(v=>v.length))/8));
  return d<=tol ? "near" : "bad";
}

/* ---- setup ---- */
function buildChips(){
  const box = $("decks"); box.innerHTML = "";
  SECS.forEach(([k,label]) => {
    const n = k==="All" ? WORDS.length : k==="Hard" ? hard.size : WORDS.filter(w=>w.s===k).length;
    const b = document.createElement("button");
    b.textContent = `${label} (${n})`; b.className = st.deck===k ? "on" : "";
    b.onclick = () => { st.deck=k; save("deck",k); buildChips(); restart(); };
    box.appendChild(b);
  });
}
function applyTheme(){ document.documentElement.classList.toggle("dark", !!st.dark); document.querySelector('meta[name=theme-color]').content = st.dark ? "#141821" : "#f6f4ef"; }
function applyDir(){ $("dirBtn").textContent = st.dir==="en" ? "EN→ES" : "ES→EN"; }
function setMode(m){ st.mode=m; save("mode",m); document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on", b.dataset.m===m)); restart(); }

function restart(){
  queue = shuffle(deckWords()); startCount = queue.length;
  score = 0; streak = 0; seen = 0;
  next();
}
function updStats(){
  const left = queue.length + (cur ? 1 : 0);
  $("sScore").textContent = `Score ${score}/${seen}`;
  $("sStreak").textContent = `Streak ${streak}${best>1?" · best "+best:""}`;
  $("sLeft").textContent = `${left} left`;
  const done = startCount ? (startCount - left)/startCount : 0;
  $("prog").style.width = Math.max(0,Math.min(100,done*100)) + "%";
}
function markHard(w, isHard){
  if (isHard) hard.add(w.id); else hard.delete(w.id);
  save("hard", [...hard]); buildChips();
}
function record(ok){
  seen++;
  if (ok){ score++; streak++; best=Math.max(best,streak); } else streak = 0;
}

function next(){
  cur = queue.shift() || null; flipped = false; answered = false;
  updStats();
  if (!cur) return finish();
  ({cards:renderCard, type:renderType, quiz:renderQuiz})[st.mode]();
}

function cardHead(w){
  return `<span class="sec">${w.s}</span>${hard.has(w.id)?'<span class="star">★</span>':''}`;
}

/* ---- Flashcards ---- */
function renderCard(){
  const w = cur;
  $("stage").innerHTML = `
   <div class="card" id="fc">${cardHead(w)}
     <span class="lab">${flipped ? (st.dir==="en"?"Spanish":"English") : (st.dir==="en"?"English":"Spanish")}</span>
     <div class="big">${esc(flipped ? answer(w) : prompt(w))}</div>
     ${flipped ? `<div class="sub">${esc(prompt(w))}</div>` : `<div class="sub">Say it out loud, then tap to check</div>`}
   </div>
   ${flipped ? `<div class="btns"><button class="b-bad" id="no">← Still learning</button><button class="b-ok" id="yes">I knew it →</button></div>`
             : `<button class="main" id="flip">Show answer</button>`}
   <p class="hint">Tap card or Space to flip · ← still learning · → knew it</p>`;
  $("fc").onclick = flip;
  if (flipped){ $("no").onclick = () => grade(false); $("yes").onclick = () => grade(true); }
  else $("flip").onclick = flip;
}
function flip(){ if (st.mode!=="cards"||!cur) return; flipped = !flipped; renderCard(); }
function grade(ok){
  if (!cur || st.mode!=="cards") return;
  if (!flipped){ flipped = true; renderCard(); return; }
  record(ok);
  if (ok){ if (st.deck==="Hard") markHard(cur,false); }
  else { markHard(cur,true); queue.splice(Math.min(queue.length, 4+Math.floor(Math.random()*4)), 0, cur); startCount++; }
  next();
}

/* ---- Type it ---- */
const ACC = ["á","é","í","ó","ú","ñ","ü","¡","¿"];
function renderType(){
  const w = cur, toFr = st.dir==="en";
  $("stage").innerHTML = `
   <div class="card" style="cursor:default;min-height:170px">${cardHead(w)}
     <span class="lab">${toFr?"English → type the Spanish":"Spanish → type the English"}</span>
     <div class="big">${esc(prompt(w))}</div>
   </div>
   <input type="text" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${toFr?"Type in Spanish…":"Type in English…"}">
   ${toFr?`<div class="acc">${ACC.map(a=>`<button data-a="${a}">${a}</button>`).join("")}</div>`:""}
   <div class="fb" id="fb"></div>
   <div class="btns" id="tbtns"><button class="b-sec" id="skip">Show me</button><button class="b-ok" id="go">Check</button></div>
   <p class="hint">Accents and capitals don't matter. Enter to check, Enter again for next.</p>`;
  const inp = $("ans"); setTimeout(()=>inp.focus(), 50);
  document.querySelectorAll(".acc button").forEach(b => b.onclick = () => {
    const s=inp.selectionStart??inp.value.length, e=inp.selectionEnd??s;
    inp.value = inp.value.slice(0,s)+b.dataset.a+inp.value.slice(e); inp.focus(); inp.setSelectionRange(s+1,s+1);
  });
  inp.addEventListener("keydown", e => { if (e.key==="Enter"){ e.preventDefault(); answered ? next() : submitType(); } });
  $("go").onclick = () => answered ? next() : submitType();
  $("skip").onclick = () => submitType(true);
}
function submitType(giveUp){
  if (answered) return; answered = true;
  const w = cur, inp = $("ans"), fb = $("fb");
  const r = giveUp ? "bad" : check(inp.value, answer(w));
  inp.blur();
  if (r==="ok"){ fb.className="fb ok"; fb.innerHTML = `✓ Correct! <b>${esc(answer(w))}</b>`; record(true); if (st.deck==="Hard") markHard(w,false); }
  else if (r==="near"){ fb.className="fb near"; fb.innerHTML = `Nearly! Check the spelling: <b>${esc(answer(w))}</b><br><span class="small">Counted as right, and added to ★ Hard ones.</span>`; record(true); markHard(w,true); }
  else { fb.className="fb bad"; fb.innerHTML = `${giveUp?"":"✗ Not quite. "}Answer: <b>${esc(answer(w))}</b>${inp.value.trim()?`<br><span class="small">You wrote: ${esc(inp.value)}</span>`:""}
     <br><button class="link" id="override">I was right, count it</button>`; record(false); markHard(w,true);
     queue.splice(Math.min(queue.length,5), 0, w); startCount++;
     $("override").onclick = () => { score++; streak = 1; queue.splice(queue.indexOf(w),1); startCount--; markHard(w,false); toast("Counted ✓"); next(); };
  }
  $("tbtns").innerHTML = `<button class="main" id="nx">Next →</button>`;
  $("nx").onclick = next; $("nx").focus();
  updStats();
}

/* ---- Quiz ---- */
function renderQuiz(){
  const w = cur, ans = answer(w);
  const pool = WORDS.filter(x => x.id!==w.id && answer(x)!==ans);
  const same = shuffle(pool.filter(x=>x.s===w.s));
  // prefer distractors of similar length
  same.sort((a,b)=>Math.abs(answer(a).length-ans.length)-Math.abs(answer(b).length-ans.length));
  const picks = shuffle(same.slice(0,8)).slice(0,3);
  while (picks.length<3){ const x = pool[Math.floor(Math.random()*pool.length)]; if (!picks.includes(x)) picks.push(x); }
  const opts = shuffle([w, ...picks]);
  $("stage").innerHTML = `
   <div class="card" style="cursor:default;min-height:170px">${cardHead(w)}
     <span class="lab">${st.dir==="en"?"Pick the Spanish":"Pick the English"}</span>
     <div class="big">${esc(prompt(w))}</div>
   </div>
   <div class="opts">${opts.map((o,i)=>`<button data-id="${o.id}"><span class="small">${i+1}</span>&nbsp; ${esc(answer(o))}</button>`).join("")}</div>
   <div class="fb" id="fb"></div>
   <p class="hint">Tap an answer or press 1–4 · Enter for next</p>`;
  document.querySelectorAll(".opts button").forEach(b => b.onclick = () => pickQuiz(b));
}
function pickQuiz(b){
  if (answered){ next(); return; }
  answered = true;
  const w = cur, ok = b.dataset.id===w.id;
  document.querySelectorAll(".opts button").forEach(x => { if (x.dataset.id===w.id) x.classList.add("right"); });
  if (!ok){ b.classList.add("wrong"); markHard(w,true); queue.splice(Math.min(queue.length,5),0,w); startCount++; }
  else if (st.deck==="Hard") markHard(w,false);
  record(ok);
  const fb=$("fb"); fb.className = ok?"fb ok":"fb bad";
  fb.innerHTML = ok ? "✓ Yes!" : `✗ It's <b>${esc(answer(w))}</b>`;
  updStats();
  setTimeout(()=>{ if (answered && cur===w) next(); }, ok ? 800 : 2200);
}

/* ---- Finish ---- */
function finish(){
  updStats();
  if (!startCount){
    $("stage").innerHTML = `<div class="card" style="cursor:default"><div class="big">No ★ Hard ones yet</div><div class="sub">Cards you mark "Still learning" or get wrong land here. Pick another deck to start.</div></div>`;
    return;
  }
  const pct = seen ? Math.round(score/seen*100) : 0;
  $("stage").innerHTML = `<div class="card done" style="cursor:default">
    <div class="tick">✓</div><div class="big">Deck done!</div>
    <div class="sub">${score}/${seen} right (${pct}%) · best streak ${best}</div>
    <div class="sub">★ Hard ones now: ${hard.size}</div></div>
    <div class="btns">${hard.size?`<button class="b-bad" id="goHard">Practise ★ Hard ones</button>`:""}<button class="b-ok" id="again">Go again</button></div>`;
  $("again").onclick = restart;
  if ($("goHard")) $("goHard").onclick = () => { st.deck="Hard"; save("deck","Hard"); buildChips(); restart(); };
  confetti();
}
function confetti(){
  const box=$("confetti"), cols=["#4f6bed","#1f9d6b","#d98a1f","#e0559b","#5bc0de"];
  for(let i=0;i<60;i++){ const e=document.createElement("i"); e.style.left=Math.random()*100+"vw"; e.style.background=cols[i%5]; e.style.animationDelay=Math.random()*.6+"s"; e.style.transform=`rotate(${Math.random()*360}deg)`; box.appendChild(e); }
  setTimeout(()=>box.innerHTML="",3200);
}

/* ---- keyboard ---- */
document.addEventListener("keydown", e => {
  if (e.target.tagName==="INPUT") return;
  if (st.mode==="cards"){
    if (e.key===" "||e.key==="ArrowUp"||e.key==="ArrowDown"){ e.preventDefault(); flip(); }
    else if (e.key==="ArrowLeft") grade(false);
    else if (e.key==="ArrowRight") grade(true);
  } else if (st.mode==="quiz"){
    if (/^[1-4]$/.test(e.key)){ const b=document.querySelectorAll(".opts button")[+e.key-1]; if (b) pickQuiz(b); }
    else if (e.key==="Enter" && answered) next();
  } else if (st.mode==="type" && e.key==="Enter" && answered){ next(); }
});

$("themeBtn").onclick = () => { st.dark=!st.dark; save("dark",st.dark); applyTheme(); };
$("dirBtn").onclick = () => { st.dir = st.dir==="en"?"fr":"en"; save("dir",st.dir); applyDir(); restart(); };
document.querySelectorAll("#modes button").forEach(b => b.onclick = () => setMode(b.dataset.m));
$("restart").onclick = restart;
$("clearHard").onclick = () => { if (confirm("Clear all ★ Hard ones?")){ hard.clear(); save("hard",[]); buildChips(); if (st.deck==="Hard") restart(); } };
$("total").textContent = WORDS.length;

{ const h=location.hash.slice(1); if (["cards","type","quiz"].includes(h)) st.mode=h; if (h==="dark") st.dark=true; }
applyTheme(); applyDir(); buildChips();
document.querySelectorAll("#modes button").forEach(b=>b.classList.toggle("on", b.dataset.m===st.mode));
restart();
</script>
</body>
